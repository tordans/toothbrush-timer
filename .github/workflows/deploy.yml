name: Deploy

# Builds the app and the API, uploads both to the all-inkl webspace via FTPS and checks that the new
# commit is live. The API applies database migrations itself. There are no tests here: they run
# locally before each push (Husky pre-push hook). See docs/central-storage.md for the one-time setup
# and the list of secrets (GitHub environment "production").
#
# The job only runs when the repository variable DEPLOY_ENABLED is "true". Set it as the very last
# step of the setup (Settings > Secrets and variables > Actions > Variables); until then a push
# to main does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a running deploy is never cancelled half way (a half-uploaded state is bad).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE_URL: https://brush.ingsparks.de

jobs:
  deploy:
    name: Deploy
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://brush.ingsparks.de
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build the app
        run: bun run build

      - name: Assemble the upload folders
        env:
          COMMIT: ${{ github.sha }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          INVITE_SHA256: ${{ secrets.INVITE_SHA256 }}
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "dist/index.html is missing"; exit 1; }
          rm -rf deploy-out
          mkdir -p deploy-out/site/api deploy-out/site/config deploy-out/site/logs deploy-out/site/public/api deploy-out/index/public

          # public/ = document root: the Vite build, the web server rules and the API entry
          cp -R dist/. deploy-out/site/public/
          cp deploy/.htaccess deploy-out/site/public/.htaccess
          cp api/index.php deploy-out/site/public/api/index.php

          # api/ = PHP code and migrations outside the document root (no vendor/: no dependencies)
          cp -R api/src api/migrations deploy-out/site/api/

          # config/ = DB credentials, invite word digest, commit. Generated from the secrets;
          # outside the document root.
          php deploy/make-config.php deploy-out/site/config/config.php
          php -l deploy-out/site/config/config.php > /dev/null

          # logs/ exists so the API can write its log; never served
          printf 'Require all denied\n' > deploy-out/site/logs/.htaccess

          # index.html goes up last (second pass), so visitors only switch to the new build
          # after its hashed files and the new API code are in place
          mv deploy-out/site/public/index.html deploy-out/index/public/index.html

          find deploy-out -type f ! -path '*/config/*' | sort

      # Pass 1: everything except index.html. Incremental sync, never a clean slate.
      - name: Upload API and app files (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./deploy-out/site/
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json

      # Pass 2: index.html only, which switches visitors to the new build.
      - name: Upload index.html (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./deploy-out/index/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-index.json

      - name: Check the live site
        env:
          COMMIT: ${{ github.sha }}
        run: SUMMARY_FILE="$GITHUB_STEP_SUMMARY" deploy/check.sh "$SITE_URL" "$COMMIT"
