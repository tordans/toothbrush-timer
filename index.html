<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Adds the manifest; on iPhone and iPad with the family key, see the file. -->
    <script src="/home-screen.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Zahnputz-Timer für Kinder: zwei Minuten, vier Ecken, morgens und abends. Ruhig, ohne Punkte und ohne Belohnungen."
    />
    <!-- Colours the status bar of the Home Screen app; each page sets its own (use-theme-color.ts). -->
    <meta name="theme-color" content="#354722" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Not "black-translucent": since iOS/iPadOS 26.1 the system lays a dark gradient over that bar
      that no page can remove, and lays the page out one status bar too short (a band at the
      bottom). With "default" the bar is opaque, coloured by theme-color, and the page fills the
      rest of the screen. iOS reads this tag when the icon is added: change it, re-add the icon.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zähneputzen" />
    <title>brush.ingsparks.de – Zahnputz-Timer für Kinder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
